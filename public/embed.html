<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back in Stock | Restock</title><link rel="stylesheet" href="/assets/style.css"></head><body class="embed-body"><main class="widget"><div class="brand">RESTOCK<span>.</span></div><div class="symbol">✦</div><p class="eyebrow">DON'T MISS THE DROP</p><h1>Good things<br>come back.</h1><p class="muted">That item is worth the wait. Leave your email and we’ll let you know the moment it returns.</p><form id="form"><label for="sku">Product SKU</label><input id="sku" name="sku" required maxlength="191" placeholder="e.g. SNEAKER-001"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" placeholder="you@example.com"><button type="submit" id="submit">Notify me <span>↗</span></button><p id="message" role="status" aria-live="polite"></p></form><p class="footer">Just the restock alert. No spam, ever.</p></main><script>const form=document.getElementById('form'),btn=document.getElementById('submit'),msg=document.getElementById('message');const initial=new URLSearchParams(location.search).get('sku');if(initial)document.getElementById('sku').value=initial;form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Saving your alert…';try{const r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:form.sku.value.trim(),email:form.email.value.trim()})});const data=await r.json();msg.textContent=r.ok?'✓ '+data.message:(data.error||'Please try again.');msg.className=r.ok?'success':'error';}catch(err){msg.textContent='Connection problem. Please try again.';msg.className='error'}finally{btn.disabled=false}});</script></body></html>
